<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salon Stock Take</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .upload-area {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin: 20px 0;
    }
    img#preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
    button {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    button:disabled {
      background: #aaa;
    }
    #result {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      display: none;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    #loading {
      text-align: center;
      color: #666;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Salon Stock Take</h1>

  <div class="upload-area">
    <p>Take a photo or upload an image of your stock</p>
    <input type="file" id="photoInput" accept="image/*" capture="environment" />
    <img id="preview" alt="Preview" />
  </div>

  <button id="analyseBtn" disabled>Analyse Stock</button>

  <div id="loading">Analysing your stock, please wait...</div>

  <div id="result"></div>

  <script>
    const input = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const btn = document.getElementById('analyseBtn');
    const result = document.getElementById('result');
    const loading = document.getElementById('loading');

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        btn.disabled = false;
      };
      reader.readAsDataURL(file);
    });

    btn.addEventListener('click', async () => {
      const file = input.files[0];
      if (!file) return;

      btn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': 'sANTHROPIC_API_KEY',
            'anthropic-version': '2023-06-01'
          },
          body: JSON.stringify({
            model: 'claude-opus-4-20250514',
            max_tokens: 1024,
            messages: [{
              role: 'user',
              content: [
                {
                  type: 'image',
                  source: {
                    type: 'base64',
                    media_type: file.type,
                    data: base64
                  }
                },
                {
                  type: 'text',
                  text: 'You are a stock taking assistant for a hairdressing salon. Look at this image and list all the hair products you can identify. For each product, describe what it is (e.g. shampoo, conditioner, hair dye, styling product) and the brand if visible. Be concise and clear.'
                }
              ]
            }]
          })
        });

        const data = await response.json();
        loading.style.display = 'none';
        result.style.display = 'block';
        result.textContent = data.content[0].text;
        btn.disabled = false;
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
