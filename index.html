<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salon Stock Take</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .upload-area {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin: 20px 0;
    }
    #preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
    #analyseBtn {
      background: #aaa;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    #analyseBtn.ready {
      background: #6c63ff;
    }
    #result {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      display: none;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    #loading {
      text-align: center;
      color: #666;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Salon Stock Take</h1>

  <div class="upload-area">
    <p>Take a photo or upload an image of your stock</p>
    <input type="file" id="photoInput" accept="image/*" />
    <img id="preview" alt="Preview" />
  </div>

  <button id="analyseBtn">Analyse Stock</button>
  <div id="loading">Analysing your stock, please wait...</div>
  <div id="result"></div>

  <script>
    const input = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const btn = document.getElementById('analyseBtn');
    const result = document.getElementById('result');
    const loading = document.getElementById('loading');

    let imageBase64 = null;
    let imageMimeType = null;

    function handleFile(file) {
      if (!file) return;
      imageMimeType = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        imageBase64 = e.target.result.split(',')[1];
        preview.src = e.target.result;
        preview.style.display = 'block';
        btn.classList.add('ready');
      };
      reader.readAsDataURL(file);
    }

    input.addEventListener('change', () => handleFile(input.files[0]));
    input.addEventListener('input', () => handleFile(input.files[0]));

    btn.addEventListener('click', async () => {
      if (!imageBase64) {
        alert('Please select a photo first');
        return;
      }

      loading.style.display = 'block';
      result.style.display = 'none';
      btn.classList.remove('ready');

      try {
        const response = await fetch('/api/analyse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageBase64: imageBase64,
            mimeType: imageMimeType
          })
        });

        const data = await response.json();
        loading.style.display = 'none';
        result.style.display = 'block';

        if (data.candidates && data.candidates[0]) {
          result.textContent = data.candidates[0].content.parts[0].text;
        } else {
          result.textContent = 'Unexpected response: ' + JSON.stringify(data);
        }

      } catch (error) {
        loading.style.display = 'none';
        result.style.display = 'block';
        result.textContent = 'Error: ' + error.message;
      }

      btn.classList.add('ready');
    });
  </script>

</body>
</html>
