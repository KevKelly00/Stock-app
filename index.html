<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salon Stock Take</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin: 20px 0;
    }
    .upload-area {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin: 20px 0;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .preview-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }
    button {
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    #loginBtn { background: #6c63ff; }
    #analyseBtn { background: #aaa; }
    #analyseBtn.ready { background: #6c63ff; }
    input[type="password"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    #loading {
      text-align: center;
      color: #666;
      margin-top: 16px;
      display: none;
    }
    #progress {
      font-size: 14px;
      color: #6c63ff;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
    #errorMsg {
      background: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      color: #cc0000;
      display: none;
    }
    #loginError {
      color: #cc0000;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }
    #result {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      display: none;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    #photoCount {
      font-size: 14px;
      color: #6c63ff;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Salon Stock Take</h1>

  <!-- Login Screen -->
  <div id="loginScreen" class="card">
    <p style="color:#555; margin-top:0;">Enter the password to access the app.</p>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <p id="loginError">Incorrect password, please try again.</p>
    <button id="loginBtn">Log In</button>
  </div>

  <!-- App Screen -->
  <div id="appScreen" style="display:none;">
    <div class="upload-area">
      <p>Select one or more photos of your stock</p>
      <input type="file" id="photoInput" accept="image/*" multiple />
      <p id="photoCount"></p>
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button id="analyseBtn">Analyse Stock</button>
    <div id="loading">Analysing your stock, please wait...</div>
    <div id="progress"></div>
    <div id="errorMsg"></div>
    <div id="result"></div>
  </div>

  <script>
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    const input = document.getElementById('photoInput');
    const previewGrid = document.getElementById('previewGrid');
    const photoCount = document.getElementById('photoCount');
    const btn = document.getElementById('analyseBtn');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const errorMsg = document.getElementById('errorMsg');
    const result = document.getElementById('result');

    let selectedFiles = [];

    if (sessionStorage.getItem('loggedIn') === 'true') {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
    }

    async function login() {
      const password = passwordInput.value;
      if (!password) return;
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await response.json();
      if (data.success) {
        sessionStorage.setItem('loggedIn', 'true');
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        loginError.style.display = 'none';
      } else {
        loginError.style.display = 'block';
        passwordInput.value = '';
      }
    }

    loginBtn.addEventListener('click', login);
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    function handleFiles(files) {
      if (!files || files.length === 0) return;
      selectedFiles = Array.from(files);

      previewGrid.innerHTML = '';
      selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement('img');
          img.src = e.target.result;
          previewGrid.appendChild(img);
        };
        reader.readAsDataURL(file);
      });

      photoCount.textContent = `${selectedFiles.length} photo${selectedFiles.length > 1 ? 's' : ''} selected`;
      photoCount.style.display = 'block';
      btn.classList.add('ready');
    }

    input.addEventListener('change', () => handleFiles(input.files));

    function readFileAsBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          resolve({
            base64: e.target.result.split(',')[1],
            mimeType: file.type
          });
        };
        reader.readAsDataURL(file);
      });
    }

    async function analysePhoto(base64, mimeType, index) {
      const response = await fetch('/api/analyse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64, mimeType })
      });
      const data = await response.json();
      if (data.content && data.content[0] && data.content[0].text) {
        return `--- Photo ${index + 1} ---\n${data.content[0].text}`;
      } else {
        return `--- Photo ${index + 1} ---\nCould not analyse this photo.`;
      }
    }

    btn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        alert('Please select at least one photo first');
        return;
      }

      loading.style.display = 'block';
      progress.style.display = 'block';
      result.style.display = 'none';
      errorMsg.style.display = 'none';
      btn.classList.remove('ready');

      try {
        const results = [];
        for (let i = 0; i < selectedFiles.length; i++) {
          progress.textContent = `Analysing photo ${i + 1} of ${selectedFiles.length}...`;
          const { base64, mimeType } = await readFileAsBase64(selectedFiles[i]);
          const text = await analysePhoto(base64, mimeType, i);
          results.push(text);
        }

        loading.style.display = 'none';
        progress.style.display = 'none';
        result.style.display = 'block';
        result.textContent = results.join('\n\n');

      } catch (error) {
        loading.style.display = 'none';
        progress.style.display = 'none';
        errorMsg.textContent = 'Error: ' + error.message;
        errorMsg.style.display = 'block';
      }

      btn.classList.add('ready');
    });
  </script>

</body>
</html>
